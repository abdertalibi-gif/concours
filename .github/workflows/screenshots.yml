name: Screenshots

on:
  push:
    branches: [main]
  schedule:
    # Tous les jours à 6h UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Capture home page
        run: |
          curl -sL "https://concours-hub-maroc212.vercel.app/" -o public/images/screenshots/home.png
          echo "✅ Screenshot home.png captured"

      - name: Capture masters page
        run: |
          curl -sL "https://concours-hub-maroc212.vercel.app/masters" -o public/images/screenshots/masters.png
          echo "✅ Screenshot masters.png captured"

      - name: Capture concours page
        run: |
          curl -sL "https://concours-hub-maroc212.vercel.app/concours" -o public/images/screenshots/concours.png
          echo "✅ Screenshot concours.png captured"

      - name: Capture documents page
        run: |
          curl -sL "https://concours-hub-maroc212.vercel.app/documents" -o public/images/screenshots/documents.png
          echo "✅ Screenshot documents.png captured"

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/screenshots/
          git commit -m "ci: update screenshots || skip-ci" || echo "No changes to commit"
          git push
